stage: bc
script: aic_utils/lerobot_robot_aic/scripts/train_act_policy.py
dataset_root: ${data.dataset_root}
task_metadata: ${data.task_metadata}
output_dir: ${run.output_dir}
job_name: ${run.name}
steps: 1000
batch_size: 8
device: ${hardware.effective_device}
num_workers: 4
lr: 0.0001
dataset_video_backend: pyav
save_freq: 20000
log_freq: 200
eval_freq: 0
chunk_size: 32
n_action_steps: 16
n_obs_steps: 1
dim_model: 512
dim_feedforward: 3200
n_encoder_layers: 4
n_decoder_layers: 1
n_vae_encoder_layers: 4
n_heads: 8
kl_weight: 10.0
vision_backbone: resnet50
pretrained_backbone_weights: ResNet50_Weights.IMAGENET1K_V2
replace_final_stride_with_dilation: false
dropout: 0.1
pre_norm: false
latent_dim: 32
task_conditioning: append-state
dry_run: false
