stage: offline_adapter
script: aic_utils/lerobot_robot_aic/scripts/train_vision_offline_serl.py
dataset_root: ${data.dataset_root}
act_checkpoint: null
output_dir: ${run.output_dir}
job_name: ${run.name}
steps: 1000
batch_size: 2
device: ${hardware.effective_device}
lr: 0.0001
adapter_lr: 0.0001
act_lr: 0.00001
critic_lr: 0.0001
gamma: 0.99
tau: 0.005
bc_weight: 1.0
cql_weight: 0.0
adapter_penalty_weight: 0.001
act_preservation_weight: 0.01
smoothness_weight: 0.0
action_horizon: 4
actor_mode: act_adapter
freeze_act: true
adapter_hidden_dim: 256
adapter_num_layers: 2
adapter_scale: 1.0
adapter_delta_clip: 0.05
action_clip: null
reward_mode: dataset
camera_keys: null
dataset_video_backend: pyav
save_every: 500
dry_run: false
