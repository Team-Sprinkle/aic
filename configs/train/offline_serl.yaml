stage: offline_adapter
script: aic_utils/lerobot_robot_aic/scripts/train_offline_serl.py
dataset_root: ${data.dataset_root}
task_metadata: ${data.task_metadata}
output_dir: ${run.output_dir}
job_name: ${run.name}
steps: 1000
batch_size: 64
device: ${hardware.effective_device}
lr: 0.0003
gamma: 0.99
tau: 0.005
bc_weight: 1.0
cql_weight: 0.0
action_horizon: 1
hidden_dim: 256
num_layers: 2
reward_mode: dataset
obs_mode: lowdim
include_task_vector: true
missing_task_vector: error
critic_init: scratch
critic_checkpoint: null
act_checkpoint: null
act_warmstart_mode: action_head_bias
save_every: 500
dry_run: false
