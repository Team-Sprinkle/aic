# @package _global_

defaults:
  - /train: act
  - /model: act
  - /data: hf_sfp2nic_card0_port0_randomized
  - /hardware: default
  - _self_

run:
  task_family: ${data.task_family}
  dataset_tag: ${data.dataset_tag}
  model_family: ${model.family}
  stage: ${train.stage}
  name: hf_sfp2nic_card0_port0_act_20hz_chunk8_nact2_4gpu_eval_all_v1
  output_root: outputs/train
  output_dir: ${run.output_root}/${run.task_family}/${run.dataset_tag}/${run.model_family}/${run.stage}/20260502_act_20hz_chunk8_nact2_4gpu_eval_all_v1

train:
  # The 10D task vector is already materialized into observation.state.
  # ACT only sees tensors from the LeRobot dataset; task fields are not in model config.
  task_conditioning: "off"
  steps: 60000
  batch_size: 4
  num_workers: 4
  lr: 0.0001
  dataset_video_backend: pyav
  save_freq: 5000
  log_freq: 200
  eval_freq: 0
  # Dataset is 20 Hz. Predict 0.4 s chunks and execute 0.1 s before replanning.
  chunk_size: 8
  n_action_steps: 2
  n_obs_steps: 1
  dry_run: false

hardware:
  cuda_devices:
    - 0
    - 2
    - 3
    - 4
  num_devices: 4
  effective_device: cuda:0
  distributed:
    enabled: true
    launcher: torchrun
    standalone: true
    nnodes: 1
    nproc_per_node: 4

logging:
  save_resolved_config: true
  save_git_info: true

runtime_eval:
  enabled: true
  engine_config: /home/chmin/yj/ws_aic/src/aic/outputs/runtime_eval_configs/sample_config_trial1.yaml
  poll_seconds: 5
  command_mode: none
  start_delay_sec: 1
  max_runtime_sec: 1
  control_hz: 4
  sim_wait_sec: 25
  engine_timeout_sec: 180
