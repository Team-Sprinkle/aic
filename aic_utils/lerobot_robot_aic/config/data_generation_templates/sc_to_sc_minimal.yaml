root_dir: outputs/trajectory_datasets
task_family: sc_to_sc
suffix: first_batch

generation:
  target_accepted_trajectories: 200
  max_attempts: 400
  policy: agent
  expert_mode: nominal
  auto_improve_on_failure: true
  write_expert_registry_overlay: true
  seed: 43
  append_if_exists: true

acceptance:
  success_only: true
  min_score: 90.0

scene:
  sc_ports:
    count: 2
  nic_cards:
    count: [1, 2, 3, 4, 5]
