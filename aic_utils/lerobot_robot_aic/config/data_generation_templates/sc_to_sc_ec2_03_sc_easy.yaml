root_dir: outputs/trajectory_datasets
task_family: sc_to_sc
suffix: ec2_03_sc_easy

generation:
  target_accepted_trajectories: 400
  max_attempts: 800
  policy: agent
  expert_mode: nominal
  auto_improve_on_failure: true
  write_expert_registry_overlay: true
  seed: 303
  append_if_exists: true

acceptance:
  success_only: false
  min_score: 10.0
  stop_near_gate:
    max_lateral_error_m: 0.003

scene:
  sc_ports:
    count: 1
  nic_cards:
    count: [1, 2, 3]
