root_dir: outputs/trajectory_datasets
task_family: sfp_to_nic
suffix: first_batch

generation:
  target_accepted_trajectories: 200
  max_attempts: 400
  policy: agent
  expert_mode: nominal
  auto_improve_on_failure: true
  write_expert_registry_overlay: true
  seed: 42
  append_if_exists: true

acceptance:
  success_only: true
  min_score: 90.0

scene:
  nic_cards:
    count: 1
