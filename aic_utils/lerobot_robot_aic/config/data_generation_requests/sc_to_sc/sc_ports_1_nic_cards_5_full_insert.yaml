root_dir: outputs/trajectory_datasets_sc_to_sc
task_family: sc_to_sc
suffix: sc_ports1_nic5_n100

generation:
  target_accepted_trajectories: 100
  max_attempts: 300
  max_planner_attempts: 2
  candidates_per_scene: 1
  policy: agent
  expert_mode: nominal
  auto_improve_on_failure: false
  use_gpt5_analysis: false
  write_expert_registry_overlay: true
  seed: 51500
  append_if_exists: true
  allow_short_agent_drain: true
  recorder_drain_sec: 120
  planner_recorder_drain_sec: 15
  record_planner_dataset: false
  enable_nominal_repair: true
  use_expert_registry_env: true
  env:
    AIC_EXPERT_VALIDATION_MAX_GUARDED_SPEED_MPS: "0.09"
    AIC_EXPERT_MOVEIT_APPROACH_SEGMENT_MODE: "three_stage"
    AIC_EXPERT_MOVEIT_MAX_VEL_SCALE: "0.35"
    AIC_EXPERT_MOVEIT_MAX_ACCEL_SCALE: "0.20"
    AIC_EXPERT_POSTPROCESS_MAX_TCP_SPEED_MPS: "0.025"
    AIC_EXPERT_POSTPROCESS_MAX_TCP_ACCEL_MPS2: "0.08"
    AIC_EXPERT_POSTPROCESS_APPROACH_MAX_TCP_SPEED_MPS: "0.080"
    AIC_EXPERT_POSTPROCESS_APPROACH_MAX_TCP_ACCEL_MPS2: "0.20"
    AIC_EXPERT_POSTPROCESS_APPROACH_STALL_TRANSLATION_M: "0.00025"
    AIC_EXPERT_POSTPROCESS_MIN_JERK_TRANSPORT: "true"
    AIC_EXPERT_POSTPROCESS_RETIME_JOINTS: "true"
    AIC_EXPERT_POSTPROCESS_MAX_JOINT_SPEED_RAD_S: "0.45"
    AIC_EXPERT_POSTPROCESS_JOINT_APPROACH_SPEEDUP: "3.0"
    AIC_EXPERT_POSTPROCESS_JOINT_PREINSERTION_SPEEDUP: "1.65"
    AIC_EXPERT_SC_NIC_BYPASS_LEFT_OFFSET_M: "0.08"
    AIC_EXPERT_SC_NIC_APPROACH_LEFT_OFFSET_M: "0.05"
    AIC_EXPERT_SC_NIC_MIN_RIGHT_SWEEP_M: "0.045"
