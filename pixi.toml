[workspace]
name = "aic"
authors = ["Teo Koon Peng <koonpeng@intrinsic.ai>"]
channels = ["robostack-kilted", "conda-forge"]
platforms = ["linux-64"]                                                                # "osx-arm64": macos support is not needed
version = "0.1.0"
conda-pypi-map = { "robostack-kilted" = "robostack_mapping.json" }
preview = ["pixi-build"]

[target.linux-64.dependencies]
evdev = ">=1.9.2,<2"                                                                  # teleoperation device support; not needed for policy inference
# ros-kilted-aic-moveit-config = { path = "aic_moveit_config" }                         # MoveIt planning assets; not needed for policy inference
# ros-kilted-aic-assets = { path = "aic_assets/package.xml" }                           # evaluation/simulation assets; not needed in the model container
# ros-kilted-moveit-py = "*"                                                            # expert generator MoveIt planning backend
# ros-kilted-moveit-planners-ompl = "*"                                                 # required OMPL planner plugin for MoveIt

[dependencies]
# isort = "==5.13.2"                                                                    # dev formatting; not needed for policy inference
# json5 = ">=0.13.0,<0.14"                                                              # VS Code helper; not needed for policy inference
numpy = "<2.3.0"
packaging = ">=24.2,<26.0"                                                             # required by lerobot==0.4.3
# pyright = "==1.1.408"                                                                 # dev type checking; not needed for policy inference
ros-kilted-aic-control-interfaces = { path = "aic_interfaces/aic_control_interfaces" }
ros-kilted-aic-engine-interfaces = { path = "aic_interfaces/aic_engine_interfaces" }     # required by ros-kilted-lerobot-robot-aic package metadata
ros-kilted-aic-example-policies = { path = "aic_example_policies" }
ros-kilted-aic-model = { path = "aic_model" }
ros-kilted-aic-model-interfaces = { path = "aic_interfaces/aic_model_interfaces" }
ros-kilted-aic-task-interfaces = { path = "aic_interfaces/aic_task_interfaces" }
# ros-kilted-aic-teacher-official = { path = "aic_teacher_official" }                    # data generation; not needed for policy inference
# ros-kilted-aic-teleoperation = { path = "aic_utils/aic_teleoperation" }                # teleoperation; not needed for policy inference
# ros-kilted-aic-training-interfaces = { path = "aic_utils/aic_training_interfaces" }    # training services; not needed for policy inference
ros-kilted-gazebo-rl = { path = "aic_utils/gazebo_rl" }
ros-kilted-control-msgs = "*"                                                          # lerobot_robot_ros
ros-kilted-geometry-msgs = "*"                                                         # lerobot_robot_ros
ros-kilted-lerobot-robot-aic = { path = "aic_utils/lerobot_robot_aic" }
ros-kilted-moveit-msgs = "*"                                                           # required by lerobot_robot_ros package metadata
ros-kilted-rclpy = "*"
ros-kilted-rmw-zenoh-cpp = "*"
ros-kilted-ros-core = "*"
ros-kilted-sensor-msgs = "*"                                                           # lerobot_robot_ros
ros-kilted-std-msgs = "*"                                                              # lerobot_robot_ros
# ros-kilted-std-srvs = "*"                                                             # service helpers; not needed for policy inference
# ros-kilted-tf2-ros-py = "*"                                                           # transform tooling; not needed for RunACTAdapterSERL inference
setuptools = ">=71.0.0,<81.0.0"                                                        # required by lerobot==0.4.3
# libhidapi = ">=0.15.0,<0.16"                                                          # HID devices; not needed for policy inference

[pypi-dependencies]
huggingface-hub = { version = "~=1.7" }
lerobot = "==0.5.1"
lerobot_robot_ros = { git = "https://github.com/koonpeng/lerobot-ros", rev = "87708d0ae14a724bca78f8ae9d55448332509a57", subdirectory = "lerobot_robot_ros" }
lerobot_teleoperator_devices = { git = "https://github.com/koonpeng/lerobot-ros", rev = "87708d0ae14a724bca78f8ae9d55448332509a57", subdirectory = "lerobot_teleoperator_devices" }
# mujoco = "==3.5.0"                                                                    # offline simulation; not needed for policy inference
# openai = ">=2.0.0,<3"                                                                 # teacher/debug tools; not needed for policy inference
# pynput = ">=1.7.6,<2"                                                                 # keyboard teleop; not needed for policy inference
pyspacemouse = ">=2.0.0, <3"                                                          
# mip = { git = "https://github.com/Team-Sprinkle/mip.git", rev = "f66bdb4e451481d1a968e77fe7118a6f0dac7d72" } # planning/optimization; not needed for policy inference

[pypi-options.dependency-overrides]
torch = { version = "==2.9.0", index = "https://download.pytorch.org/whl/cu128", env-markers = "sys_platform == 'linux' and platform_machine == 'x86_64'" }
torchvision = { version = "==0.24.0", index = "https://download.pytorch.org/whl/cu128", env-markers = "sys_platform == 'linux' and platform_machine == 'x86_64'" }

[activation]
scripts = ["pixi_env_setup.sh"]
