name: aic
services:
  eval:
    image: ghcr.io/intrinsic-dev/aic/aic_eval
    # image: my-eval:v1
    build:
      dockerfile: docker/aic_eval/Dockerfile
      context: ..
    command: gazebo_gui:=false launch_rviz:=false ground_truth:=false start_aic_engine:=true shutdown_on_aic_engine_exit:=true model_discovery_timeout_seconds:=600
    gpus: all
    networks:
      - default
    environment:
      AIC_EVAL_PASSWD: CHANGE_IN_PROD
      AIC_MODEL_PASSWD: CHANGE_IN_PROD
      # AIC_ENABLE_ACL: true
  model:
    image: act_adapter_serl:v1
    build:
      dockerfile: docker/aic_act_serl/Dockerfile
      context: ..
    gpus: all
    networks:
      - default
    environment:
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      ZENOH_ROUTER_CHECK_ATTEMPTS: -1
      AIC_ROUTER_ADDR: eval:7447
      AIC_MODEL_PASSWD: CHANGE_IN_PROD
      AIC_SERL_CHECKPOINT: /opt/aic_policy/act_adapter_serl/checkpoint_latest.pt
      AIC_SERL_ACT_TORCHSCRIPT: /opt/aic_policy/act_080000/act_policy_ts_080000_cpu.pt
      AIC_SERL_COMMAND_MODE: delta_pose
      AIC_SERL_COMMAND_FRAME: gripper/tcp
      AIC_SERL_CONTROL_HZ: 20
      AIC_SERL_MAX_RUNTIME_SEC: 170
      AIC_SERL_N_ACTION_STEPS: 4
      # AIC_ENABLE_ACL: true
networks:
  default:
    internal: true
